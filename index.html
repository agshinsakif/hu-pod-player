<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hungarian Podcast Player</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20%220%22%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-active: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
      --cue-active-bg: rgba(56, 189, 248, 0.18);
      --cue-active-text: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      flex: 1;
      max-width: 320px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Episode list panel */
    #sidebar {
      width: 360px;
      max-width: 100%;
      border-right: 1px solid var(--border);
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
    }

    .episode-card {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .episode-card:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .episode-card.active {
      background-color: var(--card-active);
      border-left: 4px solid var(--accent);
    }

    .episode-card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .episode-card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 10px;
    }

    /* Content & Transcript panel */
    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background-color: var(--card-bg);
      position: relative;
    }

    #transcript-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 100px;
      scroll-behavior: smooth;
    }

    .cue {
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1.6;
      font-size: 1.05rem;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .cue:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .cue.active {
      background-color: var(--cue-active-bg);
      color: var(--cue-active-text);
      font-weight: 600;
    }

    .transcript-status {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60%;
      color: var(--text-muted);
      font-size: 0.95rem;
      text-align: center;
      padding: 20px;
    }

    /* Bottom Player Bar */
    #player-bar {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }

    .now-playing-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }

    /* Mobile Responsive View */
    @media (max-width: 768px) {
      main {
        flex-direction: column;
      }

      #sidebar {
        width: 100%;
        height: 40%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      #content {
        height: 60%;
      }

      .cue {
        font-size: 1rem;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🎧 <span>Podcast Player</span></div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search episodes..." autocomplete="off">
    </div>
  </header>

  <main>
    <section id="sidebar">
      <div id="episode-list"></div>
    </section>

    <section id="content">
      <div id="transcript-container">
        <div class="transcript-status">Select an episode to begin listening</div>
      </div>

      <div id="player-bar">
        <div class="now-playing-title" id="player-title">No episode selected</div>
        <audio id="audio-element" controls preload="metadata"></audio>
      </div>
    </section>
  </main>

  <script>
    // State
    let playlist = [];
    let currentEpisode = null;
    let cues = [];
    let activeCueIndex = -1;

    // DOM Elements
    const episodeListEl = document.getElementById('episode-list');
    const searchInput = document.getElementById('search-input');
    const transcriptContainer = document.getElementById('transcript-container');
    const audioElement = document.getElementById('audio-element');
    const playerTitle = document.getElementById('player-title');

    // Robust URL resolver handling full R2 URLs and relative repo paths
    function resolveMediaUrl(rawPath) {
      if (!rawPath) return "";
      try {
        const parsed = new URL(rawPath);
        // Clean each path segment to avoid double percent-encoding
        parsed.pathname = parsed.pathname
          .split('/')
          .map(seg => encodeURIComponent(decodeURIComponent(seg)))
          .join('/');
        return parsed.toString();
      } catch (e) {
        // Fallback for local relative paths (e.g., "episodes/track.m4a")
        return rawPath
          .split('/')
          .map(seg => encodeURIComponent(decodeURIComponent(seg)))
          .join('/');
      }
    }

    // Load and initialize playlist
    async function init() {
      try {
        const res = await fetch('playlist.json?nocache=' + Date.now());
        if (!res.ok) throw new Error('Failed to load playlist.json');
        playlist = await res.json();

        renderEpisodeList(playlist);

        if (playlist.length > 0) {
          selectEpisode(playlist[0]);
        }
      } catch (err) {
        console.error(err);
        episodeListEl.innerHTML = `<div style="padding:16px;color:#f87171;">Error loading playlist.json</div>`;
      }
    }

    function renderEpisodeList(items) {
      episodeListEl.innerHTML = '';
      if (!items.length) {
        episodeListEl.innerHTML = '<div style="padding:16px;color:var(--text-muted);">No matching episodes found.</div>';
        return;
      }

      items.forEach(ep => {
        const card = document.createElement('div');
        card.className = `episode-card ${currentEpisode && currentEpisode.id === ep.id ? 'active' : ''}`;
        card.dataset.id = ep.id;

        card.innerHTML = `
          <div class="episode-card-title">${escapeHtml(ep.title)}</div>
          <div class="episode-card-meta">
            <span>📅 ${ep.upload_date || 'Unknown'}</span>
            <span>🌐 ${(ep.lang || 'hu').toUpperCase()}</span>
          </div>
        `;

        card.addEventListener('click', () => selectEpisode(ep));
        episodeListEl.appendChild(card);
      });
    }

    function selectEpisode(ep) {
      if (currentEpisode && currentEpisode.id === ep.id) return;
      currentEpisode = ep;

      // Update sidebar styling
      document.querySelectorAll('.episode-card').forEach(card => {
        card.classList.toggle('active', card.dataset.id === ep.id);
      });

      // Update audio player
      playerTitle.textContent = ep.title;
      audioElement.src = resolveMediaUrl(ep.audio);

      // Media Session Metadata for iOS lock screen
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: ep.title,
          artist: "Podcast Player",
          album: ep.upload_date || ""
        });
      }

      loadTranscript(ep);
    }

    // VTT Parser
    function parseVTTTime(str) {
      if (!str) return 0;
      const parts = str.trim().split(':');
      let secs = 0;
      if (parts.length === 3) {
        secs = parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
      } else if (parts.length === 2) {
        secs = parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
      }
      return isNaN(secs) ? 0 : secs;
    }

    function parseVTT(vttText) {
      const lines = vttText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      const parsedCues = [];
      let i = 0;

      while (i < lines.length) {
        const line = lines[i].trim();

        if (line.includes('-->')) {
          const timeParts = line.split('-->');
          const start = parseVTTTime(timeParts[0]);
          const end = parseVTTTime(timeParts[1].split(' ')[0]);

          i++;
          let textLines = [];
          while (i < lines.length && lines[i].trim() !== '') {
            textLines.push(lines[i].trim());
            i++;
          }

          // Strip HTML formatting tags (like <c> </c>, <b>)
          const text = textLines.join(' ').replace(/<[^>]+>/g, '').trim();
          if (text) {
            parsedCues.push({ start, end, text });
          }
        }
        i++;
      }
      return parsedCues;
    }

    async function loadTranscript(ep) {
      cues = [];
      activeCueIndex = -1;

      if (!ep.vtt) {
        transcriptContainer.innerHTML = '<div class="transcript-status">No transcript available for this episode.</div>';
        return;
      }

      transcriptContainer.innerHTML = '<div class="transcript-status">Loading transcript...</div>';

      try {
        const vttUrl = resolveMediaUrl(ep.vtt);
        const res = await fetch(vttUrl + '?nocache=' + Date.now());

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const vttText = await res.text();
        cues = parseVTT(vttText);

        if (!cues.length) {
          transcriptContainer.innerHTML = '<div class="transcript-status">Transcript is empty.</div>';
          return;
        }

        renderTranscript();
      } catch (err) {
        console.error("VTT Load Error:", err);
        transcriptContainer.innerHTML = `<div class="transcript-status">Could not load transcript (${err.message}).</div>`;
      }
    }

    function renderTranscript() {
      transcriptContainer.innerHTML = '';
      const fragment = document.createDocumentFragment();

      cues.forEach((cue, index) => {
        const cueDiv = document.createElement('div');
        cueDiv.className = 'cue';
        cueDiv.dataset.index = index;
        cueDiv.textContent = cue.text;

        cueDiv.addEventListener('click', () => {
          audioElement.currentTime = cue.start + 0.05;
          audioElement.play().catch(() => {});
        });

        fragment.appendChild(cueDiv);
      });

      transcriptContainer.appendChild(fragment);
    }

    // Timeupdate with backwards-looking cue fallback (matches YouTube VTT overlap)
    audioElement.addEventListener('timeupdate', () => {
      if (!cues.length) return;
      const currentTime = audioElement.currentTime;

      // 1. Check if currentTime falls strictly inside [start, end]
      let foundIndex = cues.findIndex(c => currentTime >= c.start && currentTime <= c.end);

      // 2. Backwards-looking fallback: pick the most recent cue start
      if (foundIndex === -1) {
        for (let i = cues.length - 1; i >= 0; i--) {
          if (currentTime >= cues[i].start) {
            foundIndex = i;
            break;
          }
        }
      }

      if (foundIndex !== activeCueIndex) {
        activeCueIndex = foundIndex;
        updateActiveCueDisplay();
      }
    });

    function updateActiveCueDisplay() {
      const activeElements = transcriptContainer.querySelectorAll('.cue.active');
      activeElements.forEach(el => el.classList.remove('active'));

      if (activeCueIndex >= 0) {
        const target = transcriptContainer.querySelector(`.cue[data-index="${activeCueIndex}"]`);
        if (target) {
          target.classList.add('active');
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    // Search input filter
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = playlist.filter(ep => 
        (ep.title && ep.title.toLowerCase().includes(query)) ||
        (ep.upload_date && ep.upload_date.includes(query))
      );
      renderEpisodeList(filtered);
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;

      if (e.code === 'Space') {
        e.preventDefault();
        audioElement.paused ? audioElement.play() : audioElement.pause();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        audioElement.currentTime = Math.min(audioElement.duration, audioElement.currentTime + 5);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        audioElement.currentTime = Math.max(0, audioElement.currentTime - 5);
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Run on startup
    init();
  </script>
</body>
</html>
