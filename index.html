<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Podcasts</title>
  <style>
    :root {
      --bg: #0f0d17;
      --card-bg: rgba(26, 22, 37, 0.9);
      --card-active: rgba(43, 36, 62, 0.95);
      --text: #f4efff;
      --text-muted: #8b859e;
      --accent: #8b5cf6;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      padding: max(14px, env(safe-area-inset-top)) 20px 14px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-back:active {
      background: rgba(255, 255, 255, 0.16);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 170px;
      -webkit-overflow-scrolling: touch;
    }

    .list-view {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      margin-top: 80px;
      line-height: 1.6;
      font-size: 15px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .card:active {
      background: var(--card-active);
      border-color: rgba(139, 92, 246, 0.4);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
    }

    .card-meta {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
      align-items: center;
    }

    .tag-audio-only {
      color: #eab308;
      background: rgba(234, 179, 8, 0.12);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }

    .tag-resume {
      color: var(--accent);
      background: rgba(139, 92, 246, 0.15);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }

    .transcript-view {
      display: none;
      max-width: 680px;
      margin: 0 auto;
    }

    .cue {
      font-size: 19px;
      line-height: 1.65;
      color: var(--text-muted);
      margin-bottom: 24px;
      cursor: pointer;
      user-select: text;
      -webkit-user-select: text;
      transition: color 0.15s;
    }

    .cue.active {
      color: var(--text);
      font-weight: 700;
    }

    .player-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border-top: 1px solid var(--border);
      padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .track-name {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 10px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .time-label {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      min-width: 35px;
    }

    .slider {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 4px;
    }

    .controls-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .btn-transport {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-seek {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-seek:active {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-play-pause {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 18px rgba(139, 92, 246, 0.35);
    }

    .btn-play-pause:active {
      transform: scale(0.96);
    }

    /* Top-Anchored Translation Box */
    #popover {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      margin: 0 auto;
      max-width: 560px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--accent);
      padding: 12px 18px;
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      z-index: 300;
      display: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .popover-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .popover-body {
      font-size: 15px;
      line-height: 1.4;
      color: var(--text);
    }
  </style>
</head>
<body>

  <header>
    <button class="btn-back" id="backBtn" onclick="exitToEpisodes()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Episodes
    </button>
    <span class="brand-title" id="headerTitle">Podcasts</span>
  </header>

  <main>
    <div class="list-view" id="listView">
      <div class="empty-state">Loading playlist…</div>
    </div>
    <div class="transcript-view" id="transcriptView"></div>
  </main>

  <div class="player-dock" id="playerDock" style="display: none;">
    <div class="track-name" id="currentTrackLabel">—</div>
    
    <div class="progress-bar-container">
      <span class="time-label" id="timeCurrent">0:00</span>
      <input type="range" class="slider" id="seekBar" min="0" max="100" value="0">
      <span class="time-label" id="timeTotal">0:00</span>
    </div>

    <div class="controls-center">
      <button class="btn-transport btn-seek" onclick="seekRelative(-10)" title="-10s">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <text x="12" y="15" font-size="7" font-weight="bold" fill="currentColor" text-anchor="middle" stroke="none">10</text>
        </svg>
      </button>

      <button class="btn-transport btn-play-pause" id="playPauseBtn" onclick="togglePlay()" title="Play / Pause (Spacebar)">
        <svg id="playIcon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="pauseIcon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24" style="display: none;">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>

      <button class="btn-transport btn-seek" onclick="seekRelative(10)" title="+10s">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <text x="12" y="15" font-size="7" font-weight="bold" fill="currentColor" text-anchor="middle" stroke="none">10</text>
        </svg>
      </button>
    </div>

    <audio id="audioElement" playsinline preload="auto"></audio>
  </div>

  <!-- Top-Anchored Translation Card -->
  <div id="popover">
    <div class="popover-header">
      <span class="popover-tag">English Translation</span>
    </div>
    <div class="popover-body" id="popoverContent">Translating…</div>
  </div>

  <script>
    let episodes = [];
    let cues = [];
    let activeCueIndex = -1;
    let currentEpisode = null;

    const listView = document.getElementById('listView');
    const transcriptView = document.getElementById('transcriptView');
    const headerTitle = document.getElementById('headerTitle');
    const backBtn = document.getElementById('backBtn');
    const playerDock = document.getElementById('playerDock');
    const audioElement = document.getElementById('audioElement');
    const currentTrackLabel = document.getElementById('currentTrackLabel');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');
    const seekBar = document.getElementById('seekBar');
    const popover = document.getElementById('popover');
    const popoverContent = document.getElementById('popoverContent');

    // Strict URL encoding per path segment to guarantee compatibility with iOS Safari
    function safeUrl(path) {
      if (!path) return "";
      return path.split('/').map(part => encodeURIComponent(part)).join('/');
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec <= 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    async function loadPlaylist() {
      try {
        const res = await fetch('playlist.json?nocache=' + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        episodes = await res.json();
        renderList();
      } catch (err) {
        listView.innerHTML = `<div class="empty-state">Could not load playlist.json.<br><small>${err.message}</small></div>`;
      }
    }

    function renderList() {
      listView.innerHTML = '';
      if (!episodes || episodes.length === 0) {
        listView.innerHTML = '<div class="empty-state">No episodes in playlist.json.</div>';
        return;
      }

      episodes.forEach((ep, idx) => {
        const savedPos = parseFloat(localStorage.getItem('pos_' + ep.title) || '0');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">${ep.title}</div>
          <div class="card-meta">
            <span>${ep.format || 'AUDIO'}</span>
            ${!ep.vtt ? '<span class="tag-audio-only">Audio only</span>' : ''}
            ${savedPos > 5 ? `<span class="tag-resume">Resume ${formatTime(savedPos)}</span>` : ''}
          </div>
        `;
        card.onclick = () => playEpisode(idx);
        listView.appendChild(card);
      });
    }

    async function playEpisode(index) {
      currentEpisode = episodes[index];
      currentTrackLabel.innerText = currentEpisode.title;

      audioElement.src = safeUrl(currentEpisode.audio);
      audioElement.load();

      playerDock.style.display = 'flex';
      cues = [];
      activeCueIndex = -1;

      listView.style.display = 'none';
      transcriptView.style.display = 'block';
      headerTitle.innerText = currentEpisode.title;
      backBtn.style.display = 'inline-flex';

      // Restore playback position
      const savedTime = parseFloat(localStorage.getItem('pos_' + currentEpisode.title) || '0');
      audioElement.onloadedmetadata = () => {
        timeTotal.innerText = formatTime(audioElement.duration);
        seekBar.max = audioElement.duration || 100;
        if (savedTime > 0 && savedTime < (audioElement.duration - 5)) {
          audioElement.currentTime = savedTime;
        }
      };

      if (currentEpisode.vtt) {
        try {
          const res = await fetch(safeUrl(currentEpisode.vtt) + '?nocache=' + Date.now());
          if (!res.ok) throw new Error("HTTP " + res.status);
          const text = await res.text();
          cues = parseVtt(text);
          if (cues.length > 0) {
            renderTranscript();
          } else {
            transcriptView.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 60px;">Transcript file had no lines.</div>';
          }
        } catch (err) {
          transcriptView.innerHTML = `<div style="text-align: center; color: var(--danger); margin-top: 60px;">Could not load transcript (${err.message}).</div>`;
        }
      } else {
        transcriptView.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 60px;">No transcript file available for this track.</div>';
      }

      audioElement.play().catch(() => {});
    }

    function exitToEpisodes() {
      transcriptView.style.display = 'none';
      listView.style.display = 'flex';
      headerTitle.innerText = 'Podcasts';
      backBtn.style.display = 'none';
      renderList();
    }

    function parseVttTime(str) {
      const parts = str.trim().split(":");
      let h = 0, m = 0, s = 0, ms = 0;
      if (parts.length === 3) {
        h = parseInt(parts[0], 10) || 0;
        m = parseInt(parts[1], 10) || 0;
        const sParts = parts[2].split(".");
        s = parseInt(sParts[0], 10) || 0;
        ms = sParts[1] ? parseInt(sParts[1].padEnd(3, "0").slice(0, 3), 10) : 0;
      } else if (parts.length === 2) {
        m = parseInt(parts[0], 10) || 0;
        const sParts = parts[1].split(".");
        s = parseInt(sParts[1], 10) || 0;
        ms = sParts[1] ? parseInt(sParts[1].padEnd(3, "0").slice(0, 3), 10) : 0;
      }
      return h * 3600 + m * 60 + s + ms / 1000;
    }

    function parseVtt(text) {
      const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      const list = [];
      let i = 0;
      while (i < lines.length && !lines[i].includes("-->")) i++;
      while (i < lines.length) {
        const line = lines[i].trim();
        if (line.includes("-->")) {
          const parts = line.split("-->");
          const start = parseVttTime(parts[0].trim().split(" ")[0]);
          const end = parseVttTime(parts[1].trim().split(" ")[0]);
          const textLines = [];
          i++;
          while (i < lines.length && lines[i].trim() !== "") {
            if (!lines[i].includes("-->")) textLines.push(lines[i].trim());
            i++;
          }
          const cueText = textLines.join(" ").replace(/<[^>]*>/g, "").trim();
          if (cueText) list.push({ start, end, text: cueText });
        } else {
          i++;
        }
      }
      return list;
    }

    function renderTranscript() {
      transcriptView.innerHTML = '';
      cues.forEach((cue, i) => {
        const p = document.createElement('p');
        p.className = 'cue';
        p.id = `cue-${i}`;
        p.innerText = cue.text;

        p.onclick = () => {
          const sel = window.getSelection().toString().trim();
          if (sel.length > 0) return;
          audioElement.currentTime = cue.start;
          audioElement.play().catch(() => {});
        };

        transcriptView.appendChild(p);
      });
    }

    function togglePlay() {
      if (audioElement.paused) {
        audioElement.play().catch(() => {});
        hidePopover();
      } else {
        audioElement.pause();
      }
    }

    function seekRelative(sec) {
      audioElement.currentTime = Math.max(0, Math.min(audioElement.duration || 0, audioElement.currentTime + sec));
    }

    // Spacebar control for desktop
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea') return;
        e.preventDefault();
        togglePlay();
      }
    });

    audioElement.addEventListener('play', () => {
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      hidePopover();
    });

    audioElement.addEventListener('pause', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    });

    audioElement.addEventListener('timeupdate', () => {
      const cur = audioElement.currentTime;
      timeCurrent.innerText = formatTime(cur);
      seekBar.value = cur;

      // Save position periodically
      if (currentEpisode && cur > 0) {
        localStorage.setItem('pos_' + currentEpisode.title, cur.toString());
      }

      // Sync active cue
      const idx = cues.findIndex(c => cur >= c.start && cur <= c.end);
      if (idx !== -1 && idx !== activeCueIndex) {
        if (activeCueIndex !== -1) {
          const old = document.getElementById(`cue-${activeCueIndex}`);
          if (old) old.classList.remove('active');
        }
        activeCueIndex = idx;
        const current = document.getElementById(`cue-${activeCueIndex}`);
        if (current) {
          current.classList.add('active');
          current.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    });

    seekBar.addEventListener('input', (e) => {
      audioElement.currentTime = Number(e.target.value);
    });

    // Translation & Auto-Pause Handling
    function hidePopover() {
      popover.style.display = 'none';
    }

    document.addEventListener('selectionchange', () => {
      setTimeout(handleTranslationSelection, 140);
    });

    // Autohide on touch or click elsewhere
    document.addEventListener('pointerdown', (e) => {
      if (!popover.contains(e.target)) {
        hidePopover();
      }
    });

    async function handleTranslationSelection() {
      const sel = window.getSelection();
      const txt = sel.toString().trim();
      if (txt.length > 0) {
        // Auto-pause playback upon text selection
        if (!audioElement.paused) {
          audioElement.pause();
        }

        popover.style.display = 'block';
        popoverContent.innerText = 'Translating…';

        try {
          const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(txt)}`;
          const res = await fetch(url);
          const data = await res.json();
          popoverContent.innerText = data[0].map(i => i[0]).join('');
        } catch {
          popoverContent.innerText = 'Translation service unreachable.';
        }
      }
    }

    // Left-Edge Backswipe Navigation
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        const elapsed = Date.now() - touchStartTime;

        if (touchStartX < 50 && deltaX > 70 && Math.abs(deltaY) < 60 && elapsed < 400) {
          if (transcriptView.style.display === 'block') {
            exitToEpisodes();
          } else {
            history.back();
            window.close();
          }
        }
      }
    }, { passive: true });

    loadPlaylist();
  </script>
</body>
</html>
