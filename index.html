<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="apple-touch-icon" href="web-logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Genius Podcast">
  <title>Genius Podcast</title>
  <style>
    :root {
      --bg: #0c0a14;
      --card-bg: rgba(24, 20, 36, 0.94);
      --card-active: rgba(43, 36, 62, 0.98);
      --text: #f4efff;
      --text-muted: #958ea8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --success: #10b981;
      --border: rgba(255, 255, 255, 0.09);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Header */
    header {
      position: relative;
      padding: max(14px, env(safe-area-inset-top)) 16px 14px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      z-index: 50;
    }

    .btn-header-back {
      position: absolute;
      left: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      z-index: 10;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      text-align: center;
    }

    /* Header Top-Center Marquee Container (Player View) */
    .header-marquee-wrapper {
      display: none;
      max-width: 62vw;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      mask-image: linear-gradient(to right, transparent, black 8px, black calc(100% - 8px), transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 8px, black calc(100% - 8px), transparent);
    }

    .header-marquee-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: inline-block;
      white-space: nowrap;
      text-align: center;
    }

    /* Filter & Sort Bar */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(16, 13, 24, 0.95);
      border-bottom: 1px solid var(--border);
    }

    .sort-select {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .toggle-label input {
      accent-color: var(--accent);
      cursor: pointer;
      width: 15px;
      height: 15px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 140px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .list-view {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      margin-top: 80px;
      line-height: 1.6;
      font-size: 15px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: background 0.15s, border-color 0.15s;
    }

    .card:active {
      background: var(--card-active);
      border-color: rgba(139, 92, 246, 0.4);
    }

    .card.completed {
      opacity: 0.6;
    }

    .card-index {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 26px;
      padding-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .card-content {
      flex: 1;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
      line-height: 1.35;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
      align-items: center;
    }

    .badge {
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-completed {
      color: var(--success);
      background: rgba(16, 185, 129, 0.15);
    }

    .badge-resume {
      color: var(--accent);
      background: rgba(139, 92, 246, 0.15);
    }

    .badge-audio {
      color: #eab308;
      background: rgba(234, 179, 8, 0.12);
    }

    .transcript-view {
      display: none;
      max-width: 680px;
      margin: 0 auto;
    }

    .cue {
      font-size: 19px;
      line-height: 1.65;
      color: var(--text-muted);
      margin-bottom: 24px;
      cursor: pointer;
      user-select: text;
      -webkit-user-select: text;
      transition: color 0.15s;
    }

    .cue.active {
      color: var(--text);
      font-weight: 700;
    }

    /* ----------------------------------------------------------------- */
    /* PBS (Playback Buttons Section) - Compact on Player Screen         */
    /* ----------------------------------------------------------------- */
    .playback-buttons-section {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-top: 1px solid var(--border);
      padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      transform: translateY(0);
      opacity: 1;
    }

    .playback-buttons-section.hidden-dock {
      transform: translateY(115%);
      opacity: 0;
      pointer-events: none;
    }

    /* PBS Title on Home Screen */
    .pbs-home-title-wrapper {
      display: none;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      text-align: center;
      cursor: pointer;
      mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
    }

    .pbs-home-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--bg);
      display: inline-block;
      white-space: nowrap;
    }

    .progress-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .time-label {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      min-width: 38px;
    }

    .slider {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 5px;
      touch-action: none;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      margin-bottom: 12px;
    }

    .btn-dock {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speed-btn-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-speed {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      user-select: none;
      transition: background 0.15s;
    }

    .btn-speed.active-menu, .btn-speed:active {
      background: rgba(255, 255, 255, 0.18);
    }

    .speed-popover {
      position: absolute;
      bottom: calc(100% + 8px);
      left: -8px;
      background: rgba(26, 22, 38, 0.96);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 6px 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      display: none;
      z-index: 250;
    }

    .speed-popover::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 32px;
      border-width: 6px;
      border-style: solid;
      border-color: rgba(26, 22, 38, 0.96) transparent transparent transparent;
    }

    .speed-chips {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .speed-chip {
      background: var(--bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      border-radius: 12px;
      min-width: 34px;
      height: 28px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .speed-chip:active {
      transform: scale(0.94);
    }

    .speed-chip.selected {
      background: #f4efff;
      color: #0c0a14;
      font-weight: 800;
    }

    .btn-seek {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-seek:active {
      background: rgba(255, 255, 255, 0.16);
    }

    .btn-play-pause {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 22px rgba(139, 92, 246, 0.45);
      flex-shrink: 0;
    }

    .btn-play-pause:active {
      transform: scale(0.96);
    }

    .btn-home {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg);
    }

    .btn-home:active {
      background: rgba(255, 255, 255, 0.16);
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 82%;
      max-width: 320px;
      touch-action: none;
    }

    .volume-icon {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .volume-slider {
      flex: 1;
      height: 6px;
      accent-color: var(--accent);
      cursor: pointer;
      touch-action: none;
    }

    /* ----------------------------------------------------------------- */
    /* PBS HOMESCREEN MINI MODE (Half height, centered marquee title)   */
    /* ----------------------------------------------------------------- */
    .playback-buttons-section.mini-mode {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      /* Detach from edges and bottom */
      left: 25px;
      right: 25px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      border-radius: 20px;
      /* Distinct shade of color with subtle glass effect */
      background: #c4b5fd;
      border: 3px solid rgba(139, 92, 246, 0.4);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
      padding: 10px 16px;
      gap: 14px;
    }

    .playback-buttons-section.mini-mode .pbs-home-title-wrapper {
      display: block;
    }

    .playback-buttons-section.mini-mode .progress-bar-container,
    .playback-buttons-section.mini-mode .controls-row .speed-btn-wrapper,
    .playback-buttons-section.mini-mode .controls-row .btn-seek,
    .playback-buttons-section.mini-mode .controls-row .btn-home,
    .playback-buttons-section.mini-mode .volume-row {
      display: none !important;
    }

    .playback-buttons-section.mini-mode .controls-row {
      margin-bottom: 0;
      width: auto;
      flex-shrink: 0;
    }

    .playback-buttons-section.mini-mode .btn-play-pause {
      background: var(--bg);
      color: #c4b5fd;
      box-shadow: 0 4px 12px rgba(12, 10, 20, 0.35);
    }

    .playback-buttons-section.mini-mode .btn-play-pause svg {
      width: 22px;
      height: 22px;
    }

    /* Continuous Marquee Animation */
    .marquee-active {
      display: inline-block !important;
      white-space: nowrap !important;
      will-change: transform;
      animation: marquee-scroll 12s linear infinite;
    }

    @keyframes marquee-scroll {
      0% {
        transform: translateX(10%);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    /* Scroll Top Button */
    .btn-scroll-top {
      position: fixed;
      right: 20px;
      bottom: calc(115px + env(safe-area-inset-bottom));
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 90;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s, background 0.15s;
    }

    .btn-scroll-top:active {
      transform: scale(0.92);
      background: var(--card-active);
    }

    #popover {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      margin: 0 auto;
      max-width: 560px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--accent);
      padding: 14px 18px;
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      z-index: 300;
      display: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .popover-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .popover-body {
      font-size: 15px;
      line-height: 1.45;
      color: var(--text);
    }
  </style>
</head>
<body>

  <header>
    <button class="btn-header-back" id="headerBackBtn" onclick="exitToEpisodes()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Episodes
    </button>
    <!-- Brand on Home Screen -->
    <span class="brand-title" id="headerBrandTitle">Genius Podcast</span>

    <!-- Top Center Marquee Title on Player Screen -->
    <div class="header-marquee-wrapper" id="headerMarqueeWrapper">
      <span class="header-marquee-text" id="headerMarqueeText">—</span>
    </div>
  </header>

  <div class="filter-bar" id="filterBar">
    <select class="sort-select" id="sortSelect" onchange="applySortAndRender()">
      <option value="date-desc">Date (Newest First)</option>
      <option value="date-asc">Date (Oldest First)</option>
      <option value="alpha-asc">Title (A → Z)</option>
      <option value="alpha-desc">Title (Z → A)</option>
    </select>

    <label class="toggle-label">
      <input type="checkbox" id="hideCompletedCheck" onchange="applySortAndRender()">
      Hide Completed
    </label>
  </div>

  <main id="mainContainer">
    <div class="list-view" id="listView">
      <div class="empty-state">Loading playlist…</div>
    </div>
    <div class="transcript-view" id="transcriptView"></div>
  </main>

  <button class="btn-scroll-top" id="scrollTopBtn" onclick="scrollToTop()" title="Scroll to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </button>

  <!-- Playback Buttons Section (PBS) -->
  <div class="playback-buttons-section" id="playbackButtonsSection" style="display: none;">
    <!-- Centered Marquee Title on Home Screen -->
    <div class="pbs-home-title-wrapper" id="pbsHomeTitleWrapper" onclick="openPlayerView()" title="Open Player">
      <span class="pbs-home-title" id="pbsHomeTitle">—</span>
    </div>
    
    <div class="progress-bar-container">
      <span class="time-label" id="timeCurrent">0:00</span>
      <input type="range" class="slider" id="seekBar" min="0" max="100" value="0">
      <span class="time-label" id="timeTotal">0:00</span>
    </div>

    <div class="controls-row">
      <div class="speed-btn-wrapper">
        <div class="speed-popover" id="speedPopover">
          <div class="speed-chips" id="speedChips"></div>
        </div>
        <button class="btn-dock btn-speed" id="speedBtn" onclick="toggleSpeedPopover(event)" title="Playback speed">1x</button>
      </div>

      <button class="btn-dock btn-seek" onclick="seekRelative(-10)" title="-10s">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <text x="12" y="15" font-size="7" font-weight="bold" fill="currentColor" text-anchor="middle" stroke="none">10</text>
        </svg>
      </button>

      <button class="btn-dock btn-play-pause" id="playPauseBtn" onclick="togglePlay(event)" title="Play / Pause (Spacebar)">
        <svg id="playIcon" width="34" height="34" fill="currentColor" viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="pauseIcon" width="34" height="34" fill="currentColor" viewBox="0 0 24 24" style="display: none;">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>

      <button class="btn-dock btn-seek" onclick="seekRelative(10)" title="+10s">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <text x="12" y="15" font-size="7" font-weight="bold" fill="currentColor" text-anchor="middle" stroke="none">10</text>
        </svg>
      </button>

      <button class="btn-dock btn-home" onclick="exitToEpisodes()" title="Go back to episodes">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </button>
    </div>

    <!-- Native HTML5 Volume (Resolves iOS Mute Issue) -->
    <div class="volume-row">
      <svg class="volume-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
      <input type="range" class="volume-slider" id="volumeBar" min="0" max="1" step="0.02" value="0.5">
    </div>

    <!-- Direct Audio Element -->
    <audio id="audioElement" playsinline preload="auto"></audio>
  </div>

  <div id="popover">
    <div class="popover-header">
      <span class="popover-tag">English Translation</span>
    </div>
    <div class="popover-body" id="popoverContent">Translating…</div>
  </div>

  <script>
    let rawEpisodes = [];
    let cues = [];
    let activeCueIndex = -1;
    let currentEpisode = null;

    const speedOptions = [
      { val: 0.75, label: "0,75" },
      { val: 0.9,  label: "0,9" },
      { val: 1.0,  label: "1x" },
      { val: 1.1,  label: "1,1" },
      { val: 1.25, label: "1,25" },
      { val: 1.5,  label: "1,5" },
      { val: 2.0,  label: "2" }
    ];
    let selectedSpeed = 1.0;

    const mainContainer = document.getElementById('mainContainer');
    const listView = document.getElementById('listView');
    const transcriptView = document.getElementById('transcriptView');
    const headerBrandTitle = document.getElementById('headerBrandTitle');
    const headerMarqueeWrapper = document.getElementById('headerMarqueeWrapper');
    const headerMarqueeText = document.getElementById('headerMarqueeText');
    const headerBackBtn = document.getElementById('headerBackBtn');
    const filterBar = document.getElementById('filterBar');
    const sortSelect = document.getElementById('sortSelect');
    const hideCompletedCheck = document.getElementById('hideCompletedCheck');
    const playbackButtonsSection = document.getElementById('playbackButtonsSection');
    const pbsHomeTitleWrapper = document.getElementById('pbsHomeTitleWrapper');
    const pbsHomeTitle = document.getElementById('pbsHomeTitle');
    const audioElement = document.getElementById('audioElement');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');
    const seekBar = document.getElementById('seekBar');
    const speedBtn = document.getElementById('speedBtn');
    const speedPopover = document.getElementById('speedPopover');
    const speedChipsContainer = document.getElementById('speedChips');
    const volumeBar = document.getElementById('volumeBar');
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    const popover = document.getElementById('popover');
    const popoverContent = document.getElementById('popoverContent');

    function safeUrl(path) {
      if (!path) return "";
      return path.split('/').map(part => encodeURIComponent(part)).join('/');
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec <= 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // Direct Native Volume: Prevents muted audio issue on Safari
    function setAudioVolume(val) {
      const v = Math.max(0, Math.min(1, parseFloat(val)));
      audioElement.volume = v;
      audioElement.muted = false;
    }

    ['input', 'change'].forEach(ev => {
      volumeBar.addEventListener(ev, (e) => setAudioVolume(e.target.value));
    });
    volumeBar.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    volumeBar.addEventListener('touchmove', (e) => e.stopPropagation(), { passive: true });

    // Scrolling logic
    let lastScrollTop = 0;
    mainContainer.addEventListener('scroll', () => {
      const st = mainContainer.scrollTop;
      const isHome = listView.style.display !== 'none';

      if (isHome && st > 240) {
        scrollTopBtn.style.display = 'flex';
      } else {
        scrollTopBtn.style.display = 'none';
      }

      if (Math.abs(st - lastScrollTop) > 6) {
        if (st > lastScrollTop && st > 60) {
          playbackButtonsSection.classList.add('hidden-dock');
          closeSpeedPopover();
        } else {
          playbackButtonsSection.classList.remove('hidden-dock');
        }
        lastScrollTop = st;
      }
    }, { passive: true });

    function scrollToTop() {
      mainContainer.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* Transition: Open Player View */
    function openPlayerView() {
      listView.style.display = 'none';
      filterBar.style.display = 'none';
      scrollTopBtn.style.display = 'none';
      transcriptView.style.display = 'block';

      // Header: hide brand title, show back button and marquee title in top center
      headerBrandTitle.style.display = 'none';
      headerBackBtn.style.display = 'inline-flex';
      headerMarqueeWrapper.style.display = 'block';

      // PBS: Compact Player mode (no title inside PBS)
      playbackButtonsSection.classList.remove('mini-mode');
      playbackButtonsSection.classList.remove('hidden-dock');
      mainContainer.style.paddingBottom = "190px";

      updateMarquees();
    }

    /* Transition: Exit to Home Screen */
    function exitToEpisodes() {
      transcriptView.style.display = 'none';
      listView.style.display = 'flex';
      filterBar.style.display = 'flex';

      // Header: restore brand title, hide back button and top marquee
      headerBrandTitle.style.display = 'block';
      headerBackBtn.style.display = 'none';
      headerMarqueeWrapper.style.display = 'none';

      closeSpeedPopover();

      // PBS: Mini Mode with centered marquee title
      if (currentEpisode) {
        playbackButtonsSection.classList.add('mini-mode');
        playbackButtonsSection.classList.remove('hidden-dock');
      }
      mainContainer.style.paddingBottom = "130px";
      updateMarquees();
      applySortAndRender();
    }

    function updateMarquees() {
      // 1. Top Header Marquee (Player Screen)
      headerMarqueeText.classList.remove('marquee-active');
      if (headerMarqueeWrapper.style.display === 'block') {
        setTimeout(() => {
          if (headerMarqueeText.scrollWidth > headerMarqueeWrapper.clientWidth) {
            headerMarqueeText.classList.add('marquee-active');
          }
        }, 50);
      }

      // 2. Centered PBS Marquee (Home Screen)
      pbsHomeTitle.classList.remove('marquee-active');
      if (playbackButtonsSection.classList.contains('mini-mode')) {
        setTimeout(() => {
          if (pbsHomeTitle.scrollWidth > pbsHomeTitleWrapper.clientWidth) {
            pbsHomeTitle.classList.add('marquee-active');
          }
        }, 50);
      }
    }

    function renderSpeedMenu() {
      speedChipsContainer.innerHTML = '';
      speedOptions.forEach(opt => {
        const chip = document.createElement('button');
        chip.className = `speed-chip ${opt.val === selectedSpeed ? 'selected' : ''}`;
        chip.innerText = opt.label;
        chip.onclick = (e) => {
          e.stopPropagation();
          setSpeed(opt.val, opt.label);
          closeSpeedPopover();
        };
        speedChipsContainer.appendChild(chip);
      });
    }

    function setSpeed(val, label) {
      selectedSpeed = val;
      audioElement.playbackRate = val;
      speedBtn.innerText = label || (val + "x");
      renderSpeedMenu();
    }

    function toggleSpeedPopover(e) {
      e.stopPropagation();
      const isOpen = speedPopover.style.display === 'block';
      if (isOpen) {
        closeSpeedPopover();
      } else {
        speedPopover.style.display = 'block';
        speedBtn.classList.add('active-menu');
      }
    }

    function closeSpeedPopover() {
      speedPopover.style.display = 'none';
      speedBtn.classList.remove('active-menu');
    }

    async function loadPlaylist() {
      try {
        const res = await fetch('playlist.json?nocache=' + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        rawEpisodes = await res.json();
        applySortAndRender();
      } catch (err) {
        listView.innerHTML = `<div class="empty-state">Could not load playlist.json.<br><small>${err.message}</small></div>`;
      }
    }

    function applySortAndRender() {
      const mode = sortSelect.value;
      const hideCompleted = hideCompletedCheck.checked;

      let list = [...rawEpisodes];

      if (mode === 'date-desc') {
        list.sort((a, b) => (b.raw_date || '').localeCompare(a.raw_date || ''));
      } else if (mode === 'date-asc') {
        list.sort((a, b) => (a.raw_date || '').localeCompare(b.raw_date || ''));
      } else if (mode === 'alpha-asc') {
        list.sort((a, b) => a.title.localeCompare(b.title));
      } else if (mode === 'alpha-desc') {
        list.sort((a, b) => b.title.localeCompare(a.title));
      }

      listView.innerHTML = '';
      let visibleCount = 0;

      list.forEach((ep) => {
        const isCompleted = localStorage.getItem('done_' + ep.title) === 'true';
        if (hideCompleted && isCompleted) return;

        visibleCount++;
        const savedPos = parseFloat(localStorage.getItem('pos_' + ep.title) || '0');

        const card = document.createElement('div');
        card.className = `card ${isCompleted ? 'completed' : ''}`;
        card.innerHTML = `
          <div class="card-index">${visibleCount}.</div>
          <div class="card-content">
            <div class="card-title">${ep.title}</div>
            <div class="card-meta">
              ${ep.upload_date ? `<span>📅 ${ep.upload_date}</span>` : ''}
              <span>${ep.format || 'AUDIO'}</span>
              ${!ep.vtt ? '<span class="badge badge-audio">Audio only</span>' : ''}
              ${isCompleted ? '<span class="badge badge-completed">Completed</span>' : ''}
              ${!isCompleted && savedPos > 5 ? `<span class="badge badge-resume">Resume ${formatTime(savedPos)}</span>` : ''}
            </div>
          </div>
        `;
        card.onclick = () => playEpisode(ep);
        listView.appendChild(card);
      });

      if (visibleCount === 0) {
        listView.innerHTML = '<div class="empty-state">No episodes matching your current filter.</div>';
      }
    }

    async function playEpisode(ep) {
      currentEpisode = ep;

      headerMarqueeText.innerText = currentEpisode.title;
      pbsHomeTitle.innerText = currentEpisode.title;

      audioElement.src = safeUrl(currentEpisode.audio);
      audioElement.load();
      audioElement.playbackRate = selectedSpeed;
      setAudioVolume(volumeBar.value);

      playbackButtonsSection.style.display = 'flex';
      openPlayerView();

      cues = [];
      activeCueIndex = -1;

      const wasCompleted = localStorage.getItem('done_' + currentEpisode.title) === 'true';
      const savedTime = parseFloat(localStorage.getItem('pos_' + currentEpisode.title) || '0');

      if (wasCompleted) {
        localStorage.removeItem('done_' + currentEpisode.title);
        localStorage.setItem('pos_' + currentEpisode.title, '0');
        audioElement.currentTime = 0;
      }

      audioElement.onloadedmetadata = () => {
        timeTotal.innerText = formatTime(audioElement.duration);
        seekBar.max = audioElement.duration || 100;
        if (!wasCompleted && savedTime > 0 && savedTime < (audioElement.duration - 5)) {
          audioElement.currentTime = savedTime;
        }
      };

      if (currentEpisode.vtt) {
        try {
          const res = await fetch(safeUrl(currentEpisode.vtt) + '?nocache=' + Date.now());
          if (!res.ok) throw new Error("HTTP " + res.status);
          const text = await res.text();
          cues = parseVtt(text);
          if (cues.length > 0) {
            renderTranscript();
          } else {
            transcriptView.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 60px;">Transcript file had no lines.</div>';
          }
        } catch (err) {
          transcriptView.innerHTML = `<div style="text-align: center; color: var(--danger); margin-top: 60px;">Could not load transcript (${err.message}).</div>`;
        }
      } else {
        transcriptView.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 60px;">No transcript file available for this track.</div>';
      }

      audioElement.play().catch(() => {});
    }

    function parseVttTime(str) {
      const parts = str.trim().split(":");
      let h = 0, m = 0, s = 0, ms = 0;
      if (parts.length === 3) {
        h = parseInt(parts[0], 10) || 0;
        m = parseInt(parts[1], 10) || 0;
        const sParts = parts[2].split(".");
        s = parseInt(sParts[0], 10) || 0;
        ms = sParts[1] ? parseInt(sParts[1].padEnd(3, "0").slice(0, 3), 10) : 0;
      } else if (parts.length === 2) {
        m = parseInt(parts[0], 10) || 0;
        const sParts = parts[1].split(".");
        s = parseInt(sParts[1], 10) || 0;
        ms = sParts[1] ? parseInt(sParts[1].padEnd(3, "0").slice(0, 3), 10) : 0;
      }
      return h * 3600 + m * 60 + s + ms / 1000;
    }

    function parseVtt(text) {
      const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      const list = [];
      let i = 0;
      while (i < lines.length && !lines[i].includes("-->")) i++;
      while (i < lines.length) {
        const line = lines[i].trim();
        if (line.includes("-->")) {
          const parts = line.split("-->");
          const start = parseVttTime(parts[0].trim().split(" ")[0]);
          const end = parseVttTime(parts[1].trim().split(" ")[0]);
          const textLines = [];
          i++;
          while (i < lines.length && lines[i].trim() !== "") {
            if (!lines[i].includes("-->")) textLines.push(lines[i].trim());
            i++;
          }
          const cueText = textLines.join(" ").replace(/<[^>]*>/g, "").trim();
          if (cueText) list.push({ start, end, text: cueText });
        } else {
          i++;
        }
      }
      return list;
    }

    function renderTranscript() {
      transcriptView.innerHTML = '';
      cues.forEach((cue, i) => {
        const p = document.createElement('p');
        p.className = 'cue';
        p.id = `cue-${i}`;
        p.innerText = cue.text;

        p.onclick = () => {
          const sel = window.getSelection().toString().trim();
          if (sel.length > 0) return;
          audioElement.currentTime = cue.start;
          audioElement.play().catch(() => {});
        };

        transcriptView.appendChild(p);
      });
    }

    function togglePlay(e) {
      if (e) e.stopPropagation();
      closeSpeedPopover();
      if (audioElement.paused) {
        audioElement.play().catch(() => {});
        hidePopover();
      } else {
        audioElement.pause();
      }
    }

    function seekRelative(sec) {
      closeSpeedPopover();
      audioElement.currentTime = Math.max(0, Math.min(audioElement.duration || 0, audioElement.currentTime + sec));
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
        e.preventDefault();
        togglePlay();
      }
    });

    audioElement.addEventListener('play', () => {
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      hidePopover();
    });

    audioElement.addEventListener('pause', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    });

    audioElement.addEventListener('timeupdate', () => {
      const cur = audioElement.currentTime;
      const dur = audioElement.duration || 0;
      timeCurrent.innerText = formatTime(cur);
      seekBar.value = cur;

      if (currentEpisode && cur > 0) {
        localStorage.setItem('pos_' + currentEpisode.title, cur.toString());

        if (dur > 0 && (cur >= dur - 5 || cur / dur >= 0.98)) {
          localStorage.setItem('done_' + currentEpisode.title, 'true');
        } else if (localStorage.getItem('done_' + currentEpisode.title) === 'true' && cur < dur - 10) {
          localStorage.removeItem('done_' + currentEpisode.title);
        }
      }

      const idx = cues.findIndex(c => cur >= c.start && cur <= c.end);
      if (idx !== -1 && idx !== activeCueIndex) {
        if (activeCueIndex !== -1) {
          const old = document.getElementById(`cue-${activeCueIndex}`);
          if (old) old.classList.remove('active');
        }
        activeCueIndex = idx;
        const current = document.getElementById(`cue-${activeCueIndex}`);
        if (current) {
          current.classList.add('active');
          current.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    });

    seekBar.addEventListener('input', (e) => {
      audioElement.currentTime = Number(e.target.value);
    });
    seekBar.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    seekBar.addEventListener('touchmove', (e) => e.stopPropagation(), { passive: true });

    function hidePopover() {
      popover.style.display = 'none';
    }

    document.addEventListener('selectionchange', () => {
      setTimeout(handleTranslationSelection, 140);
    });

    document.addEventListener('pointerdown', (e) => {
      if (!popover.contains(e.target)) hidePopover();
      if (!speedPopover.contains(e.target) && e.target !== speedBtn) closeSpeedPopover();
    });

    async function handleTranslationSelection() {
      const sel = window.getSelection();
      const txt = sel.toString().trim();
      if (txt.length > 0) {
        if (!audioElement.paused) audioElement.pause();

        popover.style.display = 'block';
        popoverContent.innerText = 'Translating…';

        try {
          const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(txt)}`;
          const res = await fetch(url);
          const data = await res.json();
          popoverContent.innerText = data[0].map(i => i[0]).join('');
        } catch {
          popoverContent.innerText = 'Translation service unreachable.';
        }
      }
    }

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        const elapsed = Date.now() - touchStartTime;

        if (touchStartX < 50 && deltaX > 70 && Math.abs(deltaY) < 60 && elapsed < 400) {
          if (transcriptView.style.display === 'block') {
            exitToEpisodes();
          } else {
            history.back();
            window.close();
          }
        }
      }
    }, { passive: true });

    window.addEventListener('resize', () => {
      updateMarquees();
    });

    renderSpeedMenu();
    loadPlaylist();
  </script>
</body>
</html>
