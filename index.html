<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hungarian Podcast Player</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-active: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --highlight: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      z-index: 10;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .main-container {
        flex-direction: row;
      }
    }

    /* Playlist sidebar */
    .playlist-section {
      flex: 1;
      max-height: 40%;
      overflow-y: auto;
      border-bottom: 1px solid var(--border);
    }

    @media (min-width: 768px) {
      .playlist-section {
        flex: 0 0 340px;
        max-height: none;
        border-bottom: none;
        border-right: 1px solid var(--border);
      }
    }

    .playlist-item {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .playlist-item:hover {
      background: var(--card-bg);
    }

    .playlist-item.active {
      background: var(--card-active);
      border-left: 4px solid var(--accent);
    }

    .playlist-title {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .playlist-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Transcript pane */
    .transcript-section {
      flex: 2;
      overflow-y: auto;
      padding: 24px 20px 100px 20px;
      scroll-behavior: smooth;
    }

    .cue {
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 8px;
      line-height: 1.6;
      font-size: 1.05rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cue:hover {
      background: rgba(51, 65, 85, 0.3);
      color: var(--text-main);
    }

    .cue.active {
      color: #ffffff;
      background: rgba(56, 189, 248, 0.15);
      border-left: 3px solid var(--accent);
      font-weight: 600;
    }

    .cue-time {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--accent);
      margin-right: 8px;
      font-variant-numeric: tabular-nums;
      opacity: 0.8;
    }

    .transcript-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Floating / Sticky audio player bar */
    .player-bar {
      flex-shrink: 0;
      background: #111827;
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }

    .now-playing {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .now-playing span:first-child {
      color: var(--text-main);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 12px;
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Podcast Player</h1>
  </header>

  <div class="main-container">
    <div class="playlist-section" id="playlistList">
      <div class="transcript-msg">Loading playlist...</div>
    </div>

    <div class="transcript-section" id="transcriptContainer">
      <div class="transcript-msg">Select an episode to view transcripts.</div>
    </div>
  </div>

  <div class="player-bar">
    <div class="now-playing">
      <span id="playerTitle">No episode loaded</span>
      <span id="playerStatus"></span>
    </div>
    <audio id="audioPlayer" controls preload="metadata"></audio>
  </div>

  <script>
    let playlist = [];
    let currentIndex = -1;
    let currentCues = [];
    let activeCueIndex = -1;

    const playlistList = document.getElementById('playlistList');
    const transcriptContainer = document.getElementById('transcriptContainer');
    const audioPlayer = document.getElementById('audioPlayer');
    const playerTitle = document.getElementById('playerTitle');
    const playerStatus = document.getElementById('playerStatus');

    // 1. URL cleaner: protects full R2 URLs and decodes prior to clean encoding
    function safeUrl(path) {
      if (!path) return "";
      try {
        if (path.startsWith("http://") || path.startsWith("https://")) {
          const parsed = new URL(path);
          parsed.pathname = parsed.pathname
            .split('/')
            .map(seg => encodeURIComponent(decodeURIComponent(seg)))
            .join('/');
          return parsed.toString();
        }
      } catch (e) {
        // Fallback for non-standard path string
      }
      return path
        .split('/')
        .map(part => encodeURIComponent(decodeURIComponent(part)))
        .join('/');
    }

    // 2. Fetch and initialize the playlist
    async function loadPlaylist() {
      try {
        const res = await fetch('playlist.json?nocache=' + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        playlist = await res.json();
        renderPlaylist();

        if (playlist.length > 0) {
          selectEpisode(0, false);
        } else {
          playlistList.innerHTML = '<div class="transcript-msg">Playlist is empty.</div>';
        }
      } catch (err) {
        playlistList.innerHTML = `<div class="transcript-msg">Failed to load playlist: ${err.message}</div>`;
      }
    }

    // 3. Render sidebar playlist
    function renderPlaylist() {
      playlistList.innerHTML = '';
      playlist.forEach((ep, idx) => {
        const item = document.createElement('div');
        item.className = 'playlist-item' + (idx === currentIndex ? ' active' : '');
        item.onclick = () => selectEpisode(idx, true);

        const title = document.createElement('div');
        title.className = 'playlist-title';
        title.textContent = ep.title || 'Untitled';

        const date = document.createElement('div');
        date.className = 'playlist-date';
        date.textContent = ep.upload_date || '';

        item.appendChild(title);
        item.appendChild(date);
        playlistList.appendChild(item);
      });
    }

    // 4. Select and play an episode
    function selectEpisode(index, autoplay = false) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;
      renderPlaylist();

      const ep = playlist[index];
      playerTitle.textContent = ep.title || 'Untitled';
      playerStatus.textContent = '';

      const cleanAudioUrl = safeUrl(ep.audio);
      if (audioPlayer.src !== cleanAudioUrl) {
        audioPlayer.src = cleanAudioUrl;
        audioPlayer.load();
      }

      if (autoplay) {
        audioPlayer.play().catch(err => console.log('Autoplay deferred:', err));
      }

      loadTranscript(ep);
    }

    // 5. Parse WebVTT format (handles YouTube timestamps, duplicates & styling tags)
    function parseVTT(vttText) {
      const lines = vttText.replace(/\r\n/g, '\n').split('\n');
      const cues = [];
      let startTime = null;
      let endTime = null;
      let textLines = [];

      function timeToSec(tStr) {
        const parts = tStr.trim().split(':');
        if (parts.length === 3) {
          return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
        } else if (parts.length === 2) {
          return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
        }
        return 0;
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        if (line.includes('-->')) {
          if (startTime !== null && textLines.length > 0) {
            const rawText = textLines.join(' ').replace(/<[^>]+>/g, '').trim();
            if (rawText) cues.push({ start: startTime, end: endTime, text: rawText });
          }
          const timeParts = line.split('-->');
          startTime = timeToSec(timeParts[0]);
          endTime = timeToSec(timeParts[1].split(' ')[0]);
          textLines = [];
        } else if (line && !line.startsWith('WEBVTT') && !line.startsWith('NOTE') && !/^\d+$/.test(line)) {
          textLines.push(line);
        }
      }

      if (startTime !== null && textLines.length > 0) {
        const rawText = textLines.join(' ').replace(/<[^>]+>/g, '').trim();
        if (rawText) cues.push({ start: startTime, end: endTime, text: rawText });
      }

      // Backwards-looking deduplication for YouTube rolling/overlapping cue windows
      const deduplicated = [];
      for (let j = 0; j < cues.length; j++) {
        if (j > 0 && cues[j].text === deduplicated[deduplicated.length - 1]?.text) {
          continue;
        }
        deduplicated.push(cues[j]);
      }

      return deduplicated;
    }

    // 6. Fetch and display subtitle file
    async function loadTranscript(ep) {
      currentCues = [];
      activeCueIndex = -1;

      if (!ep.vtt) {
        transcriptContainer.innerHTML = '<div class="transcript-msg">No transcript available for this track.</div>';
        return;
      }

      transcriptContainer.innerHTML = '<div class="transcript-msg">Loading transcript...</div>';

      try {
        const cleanVttUrl = safeUrl(ep.vtt);
        const cacheBuster = (cleanVttUrl.includes('?') ? '&' : '?') + 'nocache=' + Date.now();
        const res = await fetch(cleanVttUrl + cacheBuster);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const text = await res.text();
        currentCues = parseVTT(text);

        if (currentCues.length === 0) {
          transcriptContainer.innerHTML = '<div class="transcript-msg">Transcript is empty.</div>';
          return;
        }

        renderCues();
      } catch (err) {
        console.error(err);
        transcriptContainer.innerHTML = `<div class="transcript-msg">Could not load transcript (${err.message}).</div>`;
      }
    }

    // 7. Format seconds to MM:SS
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // 8. Render cues onto screen
    function renderCues() {
      transcriptContainer.innerHTML = '';
      currentCues.forEach((c, idx) => {
        const div = document.createElement('div');
        div.className = 'cue';
        div.id = `cue-${idx}`;
        div.onclick = () => {
          audioPlayer.currentTime = c.start;
          audioPlayer.play();
        };

        const timeSpan = document.createElement('span');
        timeSpan.className = 'cue-time';
        timeSpan.textContent = formatTime(c.start);

        const textSpan = document.createElement('span');
        textSpan.textContent = c.text;

        div.appendChild(timeSpan);
        div.appendChild(textSpan);
        transcriptContainer.appendChild(div);
      });
    }

    // 9. Synchronize scrolling & highlight cue based on player time
    audioPlayer.ontimeupdate = () => {
      if (currentCues.length === 0) return;
      const cur = audioPlayer.currentTime;

      // Find active cue
      let matchIdx = -1;
      for (let i = 0; i < currentCues.length; i++) {
        if (cur >= currentCues[i].start && cur <= currentCues[i].end) {
          matchIdx = i;
          break;
        }
      }

      if (matchIdx !== -1 && matchIdx !== activeCueIndex) {
        // Remove previous active state
        if (activeCueIndex !== -1) {
          const prev = document.getElementById(`cue-${activeCueIndex}`);
          if (prev) prev.classList.remove('active');
        }

        activeCueIndex = matchIdx;
        const currentElem = document.getElementById(`cue-${activeCueIndex}`);
        if (currentElem) {
          currentElem.classList.add('active');
          currentElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    };

    // Auto-advance to next track on finish
    audioPlayer.onended = () => {
      if (currentIndex + 1 < playlist.length) {
        selectEpisode(currentIndex + 1, true);
      }
    };

    // Init
    loadPlaylist();
  </script>
</body>
</html>
